aid: tackle
name: Tackle
description: >-
  Tackle is a Cloud Go-To-Market (Cloud GTM) platform that helps software companies sell
  through the AWS, Microsoft Azure, and Google Cloud marketplaces. Its developer APIs
  (developers.tackle.io) automate the full marketplace workflow: creating and managing private
  offers on AWS and Microsoft, AWS Partner Central co-sell opportunities and invitations,
  public contracts, metered usage reporting, disbursements and invoices, buyer prospecting
  (propensity-to-buy domain scoring), and SCIM 2.0 user provisioning. Authentication is
  machine-to-machine JWT (client_id/client_secret exchanged for a Bearer token), and vendors
  receive marketplace lifecycle events via registered, authenticated webhooks. Tackle is backed
  by a16z and publishes a SafeBase trust center (SOC 2 Type II, GDPR).
url: https://raw.githubusercontent.com/api-evangelist/tackle/refs/heads/main/apis.yml
accessModel:
